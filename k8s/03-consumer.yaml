apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldchain-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coldchain-consumer
  template:
    metadata:
      labels:
        app: coldchain-consumer
    spec:
      containers:
      - name: consumer
        image: saheul/coldchain:consumer  # 본인 이미지 경로
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi